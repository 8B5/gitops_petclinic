apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: eks-nginx
  name: eks-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eks-nginx
  template:
    metadata:
      labels:
        app: eks-nginx
    spec:
      containers:
        - image: 771031500557.dkr.ecr.ap-northeast-2.amazonaws.com/ecr_nginx:4b0f3d3
          name: eks-nginx
